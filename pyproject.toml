[project]
name = "helpdesk-ai-pipeline"
version = "0.1.0"
description = "Pipeline de datos de Freshservice para el proyecto DP-900."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
]

[project.scripts]
helpdesk-ai-pipeline = "helpdesk_ai_pipeline.probe:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
